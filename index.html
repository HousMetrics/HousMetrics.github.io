<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HousMetrics</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --primary: #7dd3fc;
        --accent: #a78bfa;
        --text: #edf6ff;
        --muted: #b9c7d9;
        --border: rgba(125, 211, 252, 0.22);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0b1020 0%, #0f172a 100%);
        color: var(--text);
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: min(1100px, 90vw);
        margin: 0 auto;
        text-align: center;
      }

      h1 {
        font-size: clamp(2.4rem, 5vw, 4rem);
        margin: 0 0 18px;
        line-height: 1.2;
      }

      .subtitle {
        color: var(--muted);
        font-size: 1.18rem;
        margin-bottom: 42px;
      }

      .nav-card {
        display: inline-block;
        min-width: min(340px, 80vw);
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 28px;
        text-decoration: none;
        color: var(--text);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .nav-card:hover {
        transform: translateY(-3px);
        border-color: var(--primary);
        box-shadow: 0 12px 28px rgba(125, 211, 252, 0.12);
      }

      .nav-card h2 {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: clamp(1.6rem, 2vw, 2.2rem);
      }

      .nav-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>HousMetrics</h1>
      <div class="subtitle">Explore causal inference and statistical reasoning</div>

      <a class="nav-card" href="causal-inference.html">
        <h2>Causal Inference</h2>
        <p>Click here to view the current page about confounding and linear regression.</p>
      </a>
    </main>
  </body>
</html>
